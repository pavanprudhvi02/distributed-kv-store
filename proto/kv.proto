syntax = "proto3";

package kvstore;

// Client-facing API. Any node accepts requests; a node that is not the leader
// for the key's shard answers NOT_LEADER with the leader's address.
service KeyValue {
  rpc Put(PutRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc ClusterStatus(StatusRequest) returns (StatusResponse);
}

// Node-to-node consensus traffic. `group` selects the shard's Raft group.
service Raft {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
}

enum Code {
  OK = 0;
  NOT_FOUND = 1;
  NOT_LEADER = 2;
  TIMEOUT = 3;
  INVALID_ARGUMENT = 4;
  INTERNAL = 5;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message DeleteRequest {
  string key = 1;
}

message GetRequest {
  string key = 1;
}

message WriteResponse {
  Code code = 1;
  string leader_address = 2;
  string error = 3;
}

message GetResponse {
  Code code = 1;
  bytes value = 2;
  string leader_address = 3;
  string error = 4;
}

message StatusRequest {}

message ShardStatus {
  uint32 shard = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 last_index = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
}

message StatusResponse {
  string node_id = 1;
  uint32 shard_count = 2;
  repeated ShardStatus shards = 3;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message VoteRequest {
  uint32 group = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}
