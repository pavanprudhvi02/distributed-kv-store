name: Live demo

# Builds the Raft simulation to WebAssembly and publishes the web demo to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build WebAssembly module
        run: |
          set -o pipefail
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DKV_BUILD_TESTS=OFF -DKV_BUILD_SERVER=OFF 2>&1 | tee build.log
          cmake --build build-wasm --target kv_sim -j"$(nproc)" 2>&1 | tee -a build.log || {
            grep -E "error|Error" build.log | head -8 | while IFS= read -r l; do echo "::error title=wasm build::$l"; done
            exit 1
          }
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css _site/
          cp build-wasm/raftsim.mjs build-wasm/raftsim.wasm _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" _site/index.html _site/app.js
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
